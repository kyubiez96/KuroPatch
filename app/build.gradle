plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'org.kuropatch'
    compileSdk 34

    defaultConfig {
        applicationId "org.kuropatch"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0.0"

        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    buildFeatures { viewBinding true }
}

chaquopy {
    defaultConfig { version "3.11" }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

// Sync Python engine (core/ + translate/) into src/main/python before every
// build, so the APK always embeds the current engine.
tasks.register("syncPythonEngine") {
    outputs.upToDateWhen { false }
    doLast {
        def pythonDir = file("src/main/python")
        delete(pythonDir)
        mkdir(pythonDir)
        copy {
            from(rootDir) { include("core/**", "translate/**") }
            into(pythonDir)
        }
        logger.lifecycle("Synced Python engine into ${pythonDir}")
    }
}
tasks.named("preBuild").configure {
    dependsOn("syncPythonEngine")
}
