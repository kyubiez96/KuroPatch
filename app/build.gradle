plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'org.kuropatch'
    compileSdk 34

    defaultConfig {
        applicationId "org.kuropatch"
        minSdk 26
        targetSdk 34
        versionCode 6
        // versionName MUST match the release tag (v2.0.12 -> "2.0.12").
        // v2.0.2/v2.0.3/v2.0.5 shipped with a stale versionName
        // because the tag was created before the bump landed.
        // Bump BOTH versionCode and versionName on every release --
        // versionCode must only go up.
        // (NOTE: '#' is NOT a comment in Groovy -- '#' lines here
        // broke the Gradle parse. Use '//'.)
        versionName "2.0.12"

        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    buildTypes {
        release {
            // Debug signing so assembleRelease produces app-release.apk
            // (without this AGP 8 emits app-release-unsigned.apk instead).
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig { version "3.11" }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
