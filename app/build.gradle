plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22'
    id 'com.chaquo.python'
}

android {
    namespace 'org.kuropatch'
    compileSdk 34

    defaultConfig {
        applicationId "org.kuropatch"
        minSdk 26
        targetSdk 34
        versionCode 7
        // versionName MUST match the release tag (v2.0.13 -> "2.0.13").
        // v2.0.2/v2.0.3/v2.0.5 shipped with a stale versionName
        // because the tag was created before the bump landed.
        // Bump BOTH versionCode and versionName on every release --
        // versionCode must only go up.
        // (NOTE: '#' is NOT a comment in Groovy -- '#' lines here
        // broke the Gradle parse. Use '//'.)
        versionName "2.0.13"

        // Owner token for kuro.eksi.biz.id cloud mode. Injected from the
        // KURO_OWNER_TOKEN env var (CI secret). NEVER hardcode a token
        // here -- the APK is public and the token would be trivially
        // extractable. Empty string when unset: cloud mode then refuses
        // to run with a clear "not configured" dialog (fail-closed).
        buildConfigField "String", "KURO_OWNER_TOKEN",
            "\"${System.getenv('KURO_OWNER_TOKEN') ?: ''}\""

        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    buildTypes {
        release {
            // Debug signing so assembleRelease produces app-release.apk
            // (without this AGP 8 emits app-release-unsigned.apk instead).
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig { version "3.11" }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Cloud mode (kuro.eksi.biz.id): OkHttp + kotlinx.serialization.
    // Additive: the local Chaquopy pipeline does not use these.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    testImplementation 'junit:junit:4.13.2'
    // NOTE: no MockWebServer — the sandbox blocks JVM TCP loopback, so
    // CloudRepositoryTest uses a fake OkHttp Call.Factory instead.
}
