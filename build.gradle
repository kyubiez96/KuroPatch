// Plugin versions are declared in settings.gradle's pluginManagement block so
// that app/build.gradle can use the `plugins {}` DSL without repeating them.
plugins {
    id 'com.android.application' version '8.1.4' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'com.chaquopy.python' version '15.0.1' apply false
}
