name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only the release job needs write access, so it gets its own permissions block.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NOTE: setup-android@v3 defaults to `packages: tools platform-tools`, but
      # the obsolete `tools` package was removed from current cmdline-tools.
      # sdkmanager then exits 1 ("Failed to find package 'tools'") and the job
      # fails before Gradle ever runs, so the default is overridden here.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Accept all Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      # NOTE: this repository has no committed Gradle wrapper, so the version is
      # pinned here instead. Two earlier approaches failed:
      #   - `gradle wrapper --gradle-version 8.2` uses whatever Gradle is
      #     preinstalled on the runner (currently 9.x), which cannot configure
      #     AGP 8.1 and fails during the wrapper task itself.
      #   - `gradle init --type basic` overwrites build.gradle with an empty
      #     template and destroys the project.
      # `gradle-version` makes setup-gradle install 8.2, which AGP 8.1 supports.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KuroPatch-APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Reuses the APKs built by the `build` job rather than rebuilding.
      - uses: actions/download-artifact@v4
        with:
          name: KuroPatch-APK
          path: apks

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # upload-artifact preserves the directory structure below the common
          # ancestor (app/build/outputs/apk), so the APKs arrive as
          # apks/debug/app-debug.apk and apks/release/app-release.apk.
          files: |
            apks/release/app-release.apk
            apks/debug/app-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
