name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev gzip ccache openjdk-17-jdk zip unzip libtool autoconf automake cmake gettext pkg-config
          pip install --upgrade pip setuptools buildozer cython
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroPatch-APK
          path: bin/*.apk
