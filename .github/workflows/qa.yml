name: QA gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-gates:
    name: KuroPatch v2 QA (42 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run translate module tests
        run: python3 -m unittest discover -s translate -p "test_*.py" -v

      - name: Run core engine tests
        run: python3 -m unittest discover -s tests -v
