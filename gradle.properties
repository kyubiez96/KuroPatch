# Required: every dependency in app/build.gradle is AndroidX. Without this flag
# the build fails with "This project uses AndroidX dependencies, but the
# 'android.useAndroidX' property is not enabled".
android.useAndroidX=true

# Jetifier is not needed - nothing in this project depends on support libraries.
android.enableJetifier=false

# Keep each module's R class small.
android.nonTransitiveRClass=true

# Default JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build behaviour.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
