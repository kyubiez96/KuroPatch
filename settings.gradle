pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        // Chaquopy (Python on Android) plugin + runtime artefacts.
        maven { url "https://chaquopy.com/maven" }
    }
    plugins {
        id 'com.android.application' version '8.1.4'
        id 'org.jetbrains.kotlin.android' version '1.9.22'
        id 'com.chaquopy.python' version '15.0.1'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Chaquopy runtime artefacts (per-ABI Python stdlib etc.).
        maven { url "https://chaquopy.com/maven" }
    }
}

rootProject.name = "KuroPatch"
include ':app'
